[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exex"
dynamic = ["version"]
description = "Train, merge, prune and exchange MoE experts for Gemma 4"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "torch",
    "transformers>=5.0",
    "safetensors",
    "numpy",
    "tqdm",
    "datasets",
]

[project.optional-dependencies]
analysis = ["matplotlib", "seaborn", "pandas"]
dev = ["pytest", "ruff", "tokenizers"]

[project.scripts]
exex-train = "exex.cli.train:main"
exex-eval = "exex.cli.evaluate:main"
exex-router-stats = "exex.cli.router_stats:main"
exex-extract = "exex.cli.extract:main"
exex-merge = "exex.cli.merge:main"
exex-prune = "exex.cli.prune:main"
exex-manage = "exex.cli.manage:main"
exex-analyze = "exex.cli.analyze:main"
exex-report = "exex.cli.report:main"

[tool.hatch.version]
path = "src/exex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/exex"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "SIM"]
ignore = ["E501", "E741"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B007", "B017"]
"src/exex/__init__.py" = ["E402"]
