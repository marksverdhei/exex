name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv venv && uv pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: uv pip install -e .[dev]
      - run: uv run pytest -q
